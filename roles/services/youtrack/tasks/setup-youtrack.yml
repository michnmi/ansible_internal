---
- name: "Setup-youtrack: Copy over the docker-compose.yml"
  ansible.builtin.template:
    src: "opt_youtrack_docker-compose.yml.j2"
    dest: "{{ services_youtrack_compose_project_dir }}/docker-compose.yml"
    mode: '0644'

- name: "Setup-youtrack: Run the YouTrack stack"
  community.docker.docker_compose_v2:
    project_src: "{{ services_youtrack_compose_project_dir }}"
    state: "present"
    pull: "always"
